<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SiCoP - Controle de Pregões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header { background: #2c3e50; color: white; padding: 25px 0; margin-bottom: 30px; }
        .result-card { border-left: 5px solid #3498db; transition: 0.2s; }
        .result-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .highlight { background-color: #f1c40f; padding: 0 3px; font-weight: bold; }
        .detalhe-box { background-color: #e9ecef; padding: 10px; border-radius: 5px; font-size: 0.9em; border-left: 3px solid #6c757d; }
        textarea { font-size: 11px; font-family: monospace; }
        .btn-limpar:hover { background-color: #e9ecef; color: #dc3545; }
    </style>
</head>
<body>

<div class="header text-center shadow">
    <h2>📦 SiCoP</h2>
    <p class="m-0 opacity-75">Sistema de Indexação de Materiais da Seção</p>
</div>

<div class="container">
    
    <ul class="nav nav-pills justify-content-center mb-4" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active px-4" data-bs-toggle="tab" data-bs-target="#busca">🔍 BUSCAR</button></li>
        <li class="nav-item"><button class="nav-link px-4" data-bs-toggle="tab" data-bs-target="#listar" onclick="carregarLista()">📋 LISTAR PREGÕES</button></li>
        <li class="nav-item"><button class="nav-link px-4" data-bs-toggle="tab" data-bs-target="#cadastro">📥 IMPORTAR</button></li>
        <li class="nav-item"><button class="nav-link px-4 text-danger" data-bs-toggle="tab" data-bs-target="#excluir">🗑️ EXCLUIR</button></li>
    </ul>

    <div class="tab-content">
        
        <div class="tab-pane fade show active" id="busca">
            <div class="row justify-content-center mb-4">
                <div class="col-md-8">
                    <div class="input-group input-group-lg">
                        <input type="text" id="inputBusca" class="form-control" placeholder="Digite o material..." onkeyup="if(event.key==='Enter') buscar()">
                        <button class="btn btn-primary" onclick="buscar()">Pesquisar</button>
                        <button class="btn btn-limpar bg-white" onclick="limparTela()" title="Limpar">🧹</button>
                    </div>
                </div>
            </div>
            <div id="resultados" class="row justify-content-center g-3"></div>
        </div>

        <div class="tab-pane fade" id="listar">
            <div id="listaPregoesArea" class="row justify-content-center g-3"><p class="text-center">Carregando...</p></div>
        </div>

        <div class="tab-pane fade" id="cadastro">
            <div class="card shadow-sm p-4 mx-auto" style="max-width: 800px;">
                <h5 class="mb-3">Importar Pregão (Com Crawler de Detalhes)</h5>
                <div class="alert alert-info small">
                    <strong>Atenção:</strong> Como o sistema agora busca os detalhes (Empenho/Saldo) item por item, 
                    a importação pode levar alguns segundos/minutos dependendo da quantidade de itens.
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-8"><input type="text" id="impNumero" class="form-control" placeholder="Nº do Pregão (Ex: 90060/2024)"></div>
                    <div class="col-md-4"><input type="text" id="impUasg" class="form-control" placeholder="UASG"></div>
                </div>
                <div class="mb-3"><input type="text" id="impUrl" class="form-control form-control-sm" placeholder="Cole o link da ATA aqui..."></div>
                <div class="mb-3"><textarea id="impHtml" class="form-control" rows="3" placeholder="Ou cole o HTML..."></textarea></div>
                <button class="btn btn-success w-100" onclick="importar()">Iniciar Importação Detalhada</button>
                <div id="msgImport" class="mt-2 text-center fw-bold"></div>
            </div>
        </div>

        <div class="tab-pane fade" id="excluir">
            <div class="card shadow-sm p-4 mx-auto border-danger" style="max-width: 600px;">
                <h5 class="text-danger">Excluir Pregão</h5>
                <div class="input-group mb-3">
                    <input type="text" id="delNumero" class="form-control" placeholder="Nº do Pregão">
                    <button class="btn btn-danger" onclick="excluir()">Excluir</button>
                </div>
                <div id="msgExcluir" class="mt-2 text-center fw-bold"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDetalhes" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title" id="modalTitulo">Itens</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="modalConteudo"></div></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- FUNÇÕES DE BUSCA ATUALIZADAS ---
    function buscar() {
        const termo = document.getElementById('inputBusca').value;
        const area = document.getElementById('resultados');
        if (!termo) return;
        area.innerHTML = '<div class="text-center mt-4">Buscando...</div>';
        
        fetch(`/api/busca?q=${encodeURIComponent(termo)}`).then(r => r.json()).then(d => {
            area.innerHTML = '';
            if (d.length === 0) return area.innerHTML = '<div class="alert alert-warning text-center col-md-8">Nenhum item encontrado.</div>';
            
            d.forEach((i, index) => {
                const regex = new RegExp(`(${termo})`, 'gi');
                const texto = i.descricao.replace(regex, '<span class="highlight">$1</span>');
                const uniqueId = `detalhe-${index}`;
                
                // Tratamento de valores nulos
                const descDetalhada = i.descricao_detalhada || "Sem detalhes extras.";
                const contratada = i.qtd_contratada || "-";
                const empenhada = i.qtd_empenhada || "-";
                
                area.innerHTML += `
                <div class="col-md-10">
                    <div class="card result-card bg-white p-3 h-100">
                        <div class="d-flex justify-content-between">
                            <span class="badge bg-primary mb-2">PREGÃO ${i.pregao_numero}</span>
                            <small class="text-muted">UASG: ${i.uasg}</small>
                        </div>
                        <p class="mb-1 text-dark fw-bold small">${texto}</p>
                        
                        <div class="row g-2 mt-2 small text-secondary">
                            <div class="col-3">Item: <strong>${i.item_num}</strong></div>
                            <div class="col-3">Unid: <strong>${i.unidade}</strong></div>
                            <div class="col-3">Contratado: <strong>${contratada}</strong></div>
                            <div class="col-3">Empenhado: <strong>${empenhada}</strong></div>
                        </div>

                        <button class="btn btn-sm btn-outline-secondary mt-2 w-100" type="button" data-bs-toggle="collapse" data-bs-target="#${uniqueId}">
                            Ver Descrição Detalhada
                        </button>
                        
                        <div class="collapse mt-2" id="${uniqueId}">
                            <div class="detalhe-box">
                                ${descDetalhada}
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        });
    }

    // --- (Outras funções importar/excluir/listar mantidas iguais às anteriores) ---
    // Apenas para não poluir a resposta, use as mesmas funções do index.html da resposta anterior.
    // A lógica do JS não mudou, apenas a exibição HTML acima.
    
    function carregarLista() { /* ... Código anterior ... */ }
    function verItens(num) { /* ... Código anterior ... */ }
    function limparTela() { 
        document.getElementById('inputBusca').value = ''; 
        document.getElementById('resultados').innerHTML = ''; 
        document.getElementById('inputBusca').focus();
    }
    function importar() {
        const btn = document.querySelector('#cadastro .btn-success');
        const msg = document.getElementById('msgImport');
        const dados = {
            numero_pregao: document.getElementById('impNumero').value,
            uasg: document.getElementById('impUasg').value,
            url: document.getElementById('impUrl').value,
            html: document.getElementById('impHtml').value
        };
        if(!dados.numero_pregao) return alert("Preencha o número!");
        
        btn.disabled = true; btn.innerText = "Importando itens e detalhes (Isso pode demorar)..."; msg.innerText = "";
        
        fetch('/api/importar', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(dados)
        }).then(r => r.json()).then(d => {
            btn.disabled = false; btn.innerText = "Iniciar Importação Detalhada";
            msg.innerText = d.msg;
            msg.className = d.sucesso ? "mt-2 text-center text-success" : "mt-2 text-center text-danger";
        });
    }
    function excluir() {
         const num = document.getElementById('delNumero').value;
         if(!num) return;
         if(!confirm('Apagar tudo?')) return;
         fetch('/api/excluir', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({numero_pregao:num})})
         .then(r=>r.json()).then(d => alert(d.msg));
    }
</script>
</body>
</html>
